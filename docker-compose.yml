services:
  db:
    image: postgres:16-alpine
    container_name: myhomecircle-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myhomecircle}
      POSTGRES_USER: ${POSTGRES_USER:-myhomecircle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myhomecircle}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myhomecircle} -d ${POSTGRES_DB:-myhomecircle}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: myhomecircle-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://myhomecircle:myhomecircle@db:5432/myhomecircle}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: myhomecircle-frontend
    environment:
      VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
